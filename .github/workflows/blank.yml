name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rozpakuj
        run: unzip -o ./*.zip
      - run: mvn -B package -f Ksiegi_1.21.4/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: Ksiegi
          path: Ksiegi_1.21.4/target/Ksiegi-1.0.jar
